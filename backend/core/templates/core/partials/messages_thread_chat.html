{% load static %}
{# core/partials/messages_thread_chat.html #}

<div id="messagesChatCard"
     class="card messages-chat-card msg-glass-surface messages-chat d-flex flex-column"
     data-chat-id="{{ chat.id }}"
     data-me-id="{{ request.user.id }}"
     data-username="{% if other_user %}{{ other_user.username }}{% endif %}"
     data-kind="{{ chat.kind }}"
     data-header-url="{% url 'messages_chat_header' chat.id %}">

    <div id="messagesChatHeader" class="card-header msg-glass-bar messages-chat-header d-flex align-items-center justify-content-between">
        {% include "core/partials/messages_thread_header.html" %}
    </div>

    <div id="messagesList"
         class="card-body messages-list flex-grow-1 overflow-auto"
         data-last-id="{{ last_id }}"
         data-poll-url="{% if other_user %}{% url 'messages_poll' other_user.username %}{% else %}{% url 'messages_chat_poll' chat.id %}{% endif %}">
        <div class="messages-list-inner">
            {% for message in chat_messages %}
                {% include "core/partials/message_item.html" with message=message %}
            {% endfor %}
        </div>
    </div>

    <button type="button"
            id="scroll-bottom-btn"
            class="scroll-bottom-btn hidden"
            aria-label="Прокрутить вниз"
            title="Вниз">
        <img src="{% static 'core/icons/arrow-down.svg' %}" alt="" class="icon icon--16" aria-hidden="true">
        <span id="scroll-bottom-unread" class="scroll-bottom-unread hidden">0</span>
    </button>

    <div class="messages-composer">
        <form id="messageForm"
              class="messages-form composer__form"
              method="post"
              enctype="multipart/form-data"
              data-send-url="{% if other_user %}{% url 'messages_send' other_user.username %}{% else %}{% url 'messages_chat_send' chat.id %}{% endif %}">
            {% csrf_token %}

            <div class="composer__row">
                <input id="message-attachments-input" type="file" name="attachments" multiple hidden>

                <button type="button"
                        class="composer__attach"
                        id="messages-attach-btn"
                        data-composer-attach
                        data-accept=""
                        title="Прикрепить файлы"
                        aria-label="Прикрепить файлы">
                    <img class="composer__icon" src="{% static 'core/icons/paperclip.svg' %}" alt="">
                </button>

                <button type="button"
                        class="composer__attach"
                        id="chat-voice-record-btn"
                        title="Записать голосовое"
                        aria-label="Записать голосовое">
                    <img class="composer__icon" src="{% static 'core/icons/mic.svg' %}" alt="">
                </button>

                {{ form.text }}

                <button type="submit"
                        class="composer__send composer__send--accent"
                        title="Отправить"
                        aria-label="Отправить">
                    <img class="composer__icon" src="{% static 'core/icons/send.svg' %}" alt="">
                </button>
            </div>

            <div class="composer__attachments hidden"
                 data-composer-attachments
                 data-icon-doc="{% static 'core/icons/file-doc.svg' %}"
                 data-icon-zip="{% static 'core/icons/file-zip.svg' %}"
                 data-icon-generic="{% static 'core/icons/file-generic.svg' %}">
                <div class="composer__media-grid" data-composer-media></div>
                <div class="composer__file-list" data-composer-files></div>
            </div>

            <div class="d-flex align-items-center gap-2 mt-2">
                <span id="chat-voice-record-status" class="small text-muted"></span>
            </div>

            <audio id="chat-voice-preview" class="hidden w-100 mt-2" controls></audio>

            <div id="message-upload-progress" class="progress hidden mt-2" style="height: 6px;">
                <div id="message-upload-progress-bar" class="progress-bar" style="width: 0%;"></div>
            </div>
        </form>
    </div>
</div>
