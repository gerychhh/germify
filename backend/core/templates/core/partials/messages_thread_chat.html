{# core/partials/messages_thread_chat.html #}
{% load static %}

<div id="messagesChatCard"
     class="card messages-chat-card messages-chat d-flex flex-column"
     data-chat-id="{{ chat.id }}"
     data-me-id="{{ request.user.id }}"
     data-username="{% if other_user %}{{ other_user.username }}{% endif %}"
     data-kind="{{ chat.kind }}"
     data-header-url="{% url 'messages_chat_header' chat.id %}"
     data-icon-pdf="{% static 'core/icons/file-pdf.svg' %}"
     data-icon-archive="{% static 'core/icons/file-archive.svg' %}"
     data-icon-doc="{% static 'core/icons/file-doc.svg' %}"
     data-icon-text="{% static 'core/icons/file-text.svg' %}"
     data-icon-sheet="{% static 'core/icons/file-sheet.svg' %}"
     data-icon-audio="{% static 'core/icons/file-audio.svg' %}"
     data-icon-video="{% static 'core/icons/file-video.svg' %}"
     data-icon-generic="{% static 'core/icons/file-generic.svg' %}">

    <div id="messagesChatHeader" class="card-header messages-chat-header d-flex align-items-center justify-content-between">
        {% include "core/partials/messages_thread_header.html" %}
    </div>

    <div id="messagesList"
         class="card-body messages-list flex-grow-1 overflow-auto"
         data-last-id="{{ last_id }}"
         data-poll-url="{% if other_user %}{% url 'messages_poll' other_user.username %}{% else %}{% url 'messages_chat_poll' chat.id %}{% endif %}">

        {% for message in chat_messages %}
            {% include "core/partials/message_item.html" with message=message %}
        {% endfor %}
    </div>

    <button type="button"
            id="scroll-bottom-btn"
            class="scroll-bottom-btn hidden"
            aria-label="Прокрутить вниз"
            title="Вниз">
        ⬇
        <span id="scroll-bottom-unread" class="scroll-bottom-unread hidden">0</span>
    </button>

    <div class="card-footer">
        <form id="messageForm"
              class="messages-form"
              method="post"
              enctype="multipart/form-data"
              data-send-url="{% if other_user %}{% url 'messages_send' other_user.username %}{% else %}{% url 'messages_chat_send' chat.id %}{% endif %}">
            {% csrf_token %}

            <div class="d-flex gap-2 align-items-end">
                <button type="button"
                        class="btn btn-light border messages-attach-btn"
                        id="messages-attach-btn"
                        title="Прикрепить файлы">
                    <img src="{% static 'core/icons/paperclip.svg' %}" alt="" class="g-ic">
                </button>

                <button type="button"
                        class="btn btn-light border voice-record-btn"
                        id="chat-voice-record-btn"
                        title="Записать голосовое">
                    <img src="{% static 'core/icons/mic.svg' %}" alt="" class="g-ic">
                    <span class="ms-1 voice-record-btn__text">Голос</span>
                </button>

                <div class="flex-grow-1">
                    {{ form.text }}

                    <div class="d-flex align-items-center gap-2 mt-1">
                        <span id="chat-voice-record-status" class="small text-muted"></span>
                    </div>

                    <audio id="chat-voice-preview" class="hidden w-100 mt-2" controls></audio>

                    <div id="messages-selected-files" class="post-edit-attachments-list mt-2"></div>

                    <div id="message-upload-progress" class="progress hidden mt-2" style="height: 6px;">
                        <div id="message-upload-progress-bar" class="progress-bar" style="width: 0%;"></div>
                    </div>
                </div>

                <input type="file" id="message-attachments-input" name="attachments" multiple class="d-none" />

                <button type="submit" class="btn btn-primary">Отправить</button>
            </div>
        </form>
    </div>
</div>
