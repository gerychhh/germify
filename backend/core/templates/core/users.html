{% extends "core/base.html" %}
{% load static %}

{% block title %}Пользователи — GERMiFY{% endblock %}

{% block extra_css %}
  <link rel="stylesheet" href="{% static 'core/css/pages/users/users.css' %}?v=1">
{% endblock %}

{% block content %}
<div class="g-pagehead">
  <div class="g-pagehead__title">Пользователи</div>

  <div class="w-100 g-input-icon g-pagehead__search">
    <span class="g-input-icon__icon" aria-hidden="true">
      <img src="{% static 'core/icons/search.svg' %}" alt="" class="icon icon--16">
    </span>
    <input id="usersSearch"
           type="search"
           class="form-control"
           placeholder="Поиск по имени или @username..."
           value="{{ q|default:'' }}">
  </div>
</div>

<div id="usersList" class="vstack gap-2">
  {% for u in users %}
    {% include "core/partials/user_card.html" %}
  {% endfor %}
</div>

{% if has_next %}
  <div id="usersSpinner" class="text-center mt-3" style="display:none;">
    <div class="spinner-border" role="status"></div>
  </div>
  <div id="usersSentinel" class="py-2"></div>
{% endif %}

<script>
  window.__usersNextPage = {{ next_page|default:"null" }};
  window.__usersHasNext = {{ has_next|yesno:"true,false" }};
  window.__usersInitialQ = {{ q|default:"''"|safe }};
</script>

<script src="{% static 'core/js/users.js' %}?v=1" defer></script>
{% endblock %}
