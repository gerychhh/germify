services:
  db:
    image: mysql:8.0
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-germify}
      MYSQL_USER: ${MYSQL_USER:-germify_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-mysqlmysql@@1}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpass}
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  web:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file: .env
    environment:
      MYSQL_HOST: db
      MYSQL_PORT: 3306
      REDIS_URL: redis://redis:6379/0
      DJANGO_PORT: 8000
    expose:
      - "8000"
    volumes:
      - ./backend:/app
      - static_data:/app/staticfiles
      - media_data:/app/media
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import socket; s=socket.create_connection(('127.0.0.1',8000),2); s.close()\""]
      interval: 10s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      web:
        condition: service_healthy
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - "${CERTS_PATH:-C:/Program Files/win-acme/germify}:/certs:ro"
      - static_data:/static:ro
      - media_data:/media:ro
    restart: unless-stopped

volumes:
  db_data:
  static_data:
  media_data:
